name: Windows build

# Builds Tend's Photo for Windows x64 and uploads a zip with the exe as a workflow artifact.
# Run it from the Actions tab (Run workflow), or it runs on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The binaries link the C runtime statically, so no Visual C++ redistributable is needed.
  RUSTFLAGS: -C target-feature=+crt-static

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Update Rust toolchain
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Build
        shell: pwsh
        run: cargo build --release --locked -p photocraft

      - name: Package
        shell: pwsh
        run: |
          $dir = "dist/tends-photo-windows-x64"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/photocraft.exe "$dir/TendsPhoto.exe"
          Copy-Item LICENSE-MIT, LICENSE-APACHE, NOTICE, ATTRIBUTION.md $dir
          Compress-Archive -Path $dir -DestinationPath dist/tends-photo-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: tends-photo-windows
          path: dist/tends-photo-windows-x64.zip
          if-no-files-found: error

      # Also publish the zip as a (pre)release named "windows-latest", which Tend's Hub downloads.
      # It is a prerelease so it never counts as the repository's latest release.
      - name: Publish release asset
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "dist/tends-photo-windows-x64.zip"
          $notes = "commit: $env:GITHUB_SHA"
          gh release view windows-latest 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-latest $zip --prerelease --latest=false --title "Windows build (latest main)" --notes $notes
          } else {
            gh release upload windows-latest $zip --clobber
            gh release edit windows-latest --notes $notes --prerelease --latest=false
          }
